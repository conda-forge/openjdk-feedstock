schema_version: 1

context:
  # constants
  version: 21.0.13.1
  openjdk_revision: 2
  zulu_build: 21.54.201-ca
  zulu_url: https://cdn.azul.com/zulu/bin
  # derived
  major: ${{ (version | split("."))[0] | int }}
  jdk_full: ${{ version }}+${{ openjdk_revision }}
  zulu_base: zulu${{ zulu_build }}-jdk${{ version }}
  # platform-specific
  homepage: ${{ "https://openjdk.java.net" if linux else "https://www.azul.com/products/zulu/" }}
  extra_license: ${{ "fonts/LICENSE" if linux else "LICENSE" }}
  summary: ${{ "An open-source implementation of the JDK" if linux else "The Zulu OpenJDK build" }}

  # only combinations are {osx, win} x {x64, arm64}
  zulu_os: ${{ "macosx" if osx else "win" }}
  zulu_arch: ${{ "x64" if x86_64 else "aarch64" }}
  zulu_hash: ${{ "081f80393c474c1f9a155a65f154f7ea257e19568ba017e8ac73991efab37b06" if (osx and x86_64) else
                 "21cb1d0ad5acbf908abd28e55c85b2000876556d80409fc4085b33cb040ba16a" if (osx and arm64) else
                 "14e7a0395df4f09b508d50aa65a858650d59eb8d2221df57b4742d0830f3a3a0" if (win and x86_64) else
                 "904e945c83627646b44e00a7a7152e5fe50d33dd00775f60e6167e9916f8da40" }}

recipe:
  name: openjdk
  version: ${{ version }}

source:
  - if: linux
    then:
      - target_directory: src
        url: https://github.com/openjdk/jdk${{ major }}u/archive/refs/tags/jdk-${{ jdk_full }}.tar.gz
        sha256: 2f00670ffe781881c6fdb60f49ecdfd12a6c0f5e2943b94d17b1f4bc714397f9
      - target_directory: fonts
        url: https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
        sha256: 7576310b219e04159d35ff61dd4a4ec4cdba4f35c00e002a136f00e96a908b0a
    else:
      # example of full url for zulu_build=17.44.15-ca & version=17.0.8:
      # https://cdn.azul.com/zulu/bin/zulu17.44.15-ca-jdk17.0.8-macosx_x64.zip
      - url: ${{ zulu_url }}/${{ zulu_base }}-${{ zulu_os }}_${{ zulu_arch }}.zip
        sha256: ${{ zulu_hash }}

build:
  number: 0

outputs:
  - package:
      name: openjdk
    build:
      script:
        file: build
      dynamic_linking:
        # Binaries are already relocatable and conda-build's post-processing would add a very long RPATH to binaries
        # which doesn't fit anymore into the __LINKEDIT section. For this, we either need to manually reassemble
        # the Mach-O header or build everything from source.
        binary_relocation: ${{ false if osx else true }}
    requirements:
      build:
        # compilers also on osx for creating signatures, on win for run-exports
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
        - if: linux
          then:
            # boot JDK for the from-source build; must be JDK N-1 or N
            - openjdk >=${{ major - 1 }},<${{ major + 1 }}
            - autoconf
            - make
            - pkgconf
            - unzip
            - zip
            - if: build_platform != host_platform
              then:
                - alsa-lib
                - fontconfig
                - freetype
                - giflib
                - harfbuzz
                - lcms2
                - libcups
                - libjpeg-turbo
                - libpng
                - xorg-libx11
                - xorg-libxext
                - xorg-libxi
                - xorg-libxrandr
                - xorg-libxrender
                - xorg-libxt
                - xorg-libxtst
                - xorg-xorgproto
                - zlib
        - if: win
          then:
            - m2-bash
            - symlink-exe-build
      host:
        - if: linux
          then:
            - alsa-lib
            - fontconfig
            - freetype
            - giflib
            - harfbuzz
            - harfbuzz
            - lcms2
            - libcups
            - libjpeg-turbo
            - libpng
            - xorg-libx11
            - xorg-libxext
            - xorg-libxi
            - xorg-libxrandr
            - xorg-libxrender
            - xorg-libxt
            - xorg-libxtst
            - xorg-xorgproto
        - if: unix
          then:
            - zlib
      run:
        - if: linux
          then:
            - xorg-libx11
            - xorg-libxext
            - xorg-libxi
            - xorg-libxrender
            - xorg-libxtst
      ignore_run_exports:
        by_name:
          # the produced artefacts still need libc++.*.dylib on osx,
          # but the one in the platform sdk is enough; avoid extra run-export
          - libcxx
    tests:
      - files:
          recipe:
            - test-nio/
            - if: unix
              then:
                - test-jni/
                - test-jni.sh
                - run_test.sh
              else:
                - run_test.bat
        requirements:
          run:
            - if: unix
              then:
                - ${{ compiler("c") }}
        script:
          - java -version
          - if: unix
            then:
              - '${JAVA_HOME}/bin/java -version'
              - test -f ${JAVA_HOME}/release
              - if: not ppc64le
                then:
                  - ./test-jni.sh

            else:
              - '%JAVA_HOME%\bin\java -version'
              - if not exist %JAVA_HOME%\\release exit 1
about:
  homepage: ${{ homepage }}
  license: GPL-2.0-or-later WITH Classpath-exception-2.0
  license_file:
    - LICENSE
    - ${{ extra_license }}
  summary: ${{ summary }}

extra:
  recipe-maintainers:
    - johanneskoester
    - sodre
    - CJ-Wright
    - xhochy
    - izahn
    - h-vetinari
